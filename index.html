<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Manit Bisht · Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Michroma&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #000000;
      color: #e4e4e7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .font-display {
      font-family: "Michroma", sans-serif;
    }
    a {
      color: #a1a1aa;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    a:hover {
      color: #ffffff;
    }
    .minimal-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f4f4f5;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .minimal-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
      color: #ffffff;
    }
    .subtle-btn {
      background: transparent;
      border: none;
      color: #71717a;
      font-size: 12px;
      cursor: pointer;
      padding: 7px 10px;
      transition: color 0.15s ease;
    }
    .subtle-btn:hover {
      color: #ffffff;
    }
    .contact-col-title {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #71717a;
      margin-bottom: 8px;
    }
    .contact-item {
      font-size: 13px;
      line-height: 1.6;
      color: #d4d4d8;
    }
  </style>
</head>
<body>
  <canvas id="three-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;"></canvas>
  <canvas id="console-canvas" style="display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; text-rendering: optimizeLegibility;
  -moz-osx-font-smoothing: grayscale;"></canvas>
  <div id="hyperspace-flash" style="display: none; position: fixed; inset: 0; background: #ffffff; z-index: 10; pointer-events: none; opacity: 0; transition: opacity 0.4s ease;"></div>
  
  <!-- Minimal Wormhole Timeline Year Progress HUD -->
  <div id="wormhole-year-hud" style="display: none; position: fixed; right: 32px; top: 50%; transform: translateY(-50%); z-index: 15; pointer-events: none; opacity: 0; transition: opacity 0.3s ease;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span id="year-hud-value" style="font-family: 'Michroma', sans-serif; font-size: 13px; font-weight: 400; color: #f4f4f5; letter-spacing: 0.08em;">2023</span>
      <div style="position: relative; width: 1px; height: 120px; background: rgba(255, 255, 255, 0.15);">
        <div id="year-hud-fill" style="position: absolute; top: 0; left: 0; width: 100%; height: 0%; background: #ffffff; transition: height 0.05s linear;"></div>
        <div id="year-hud-pip" style="position: absolute; left: 50%; top: 0%; transform: translate(-50%, -50%); width: 5px; height: 5px; background: #ffffff; border-radius: 50%;"></div>
      </div>
    </div>
  </div>

  <!-- Minimal Dock Contact Section below White Hole -->
  <section id="contact-section" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; transform: translateY(105%); opacity: 0; pointer-events: none; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;">
    <div style="background: rgba(9, 9, 11, 0.92); border-top: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);">
      <div style="max-width: 960px; margin: 0 auto; padding: 26px 24px 30px;">
        
        <!-- Header row -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;">
          <div>
            <h2 class="font-display" style="margin: 0; font-size: 19px; font-weight: 400; color: #ffffff; letter-spacing: 0.05em;">MANIT BISHT</h2>
            <p style="margin: 4px 0 0; font-size: 13px; color: #a1a1aa; font-weight: 400;">Computer Science Undergrad · Vellore Institute of Technology</p>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <a href="./Manit_Bisht_Resume.pdf" download="Manit_Bisht_Resume.pdf" target="_blank" rel="noopener noreferrer" class="minimal-btn">
              <span>Resume</span>
              <span style="opacity: 0.7;">↓</span>
            </a>
            <button id="back-to-top-btn" class="subtle-btn">Top ↑</button>
          </div>
        </div>

        <div style="height: 1px; background: rgba(255, 255, 255, 0.07); margin: 18px 0;"></div>

        <!-- Details Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
          <div>
            <div class="contact-col-title">Direct</div>
            <div class="contact-item"><a href="mailto:manit.bisht2007@gmail.com">manit.bisht2007@gmail.com</a></div>
            <div class="contact-item" style="margin-top: 4px;"><a href="tel:+918077105262">+91 8077105262</a></div>
          </div>
          <div>
            <div class="contact-col-title">Profiles</div>
            <div class="contact-item"><a href="https://github.com/Spacemanit" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
            <div class="contact-item" style="margin-top: 4px;"><a href="https://linkedin.com/in/manit-bisht" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a></div>
          </div>
          <div>
            <div class="contact-col-title">Availability</div>
            <div class="contact-item" style="display: flex; align-items: center; gap: 6px;">
              <span style="width: 6px; height: 6px; background: #10b981; border-radius: 50%; display: inline-block;"></span>
              <span>Open for Internships</span>
            </div>
            <div class="contact-item" style="color: #71717a; margin-top: 4px;">Bareilly, UP, India</div>
          </div>
        </div>

      </div>
    </div>
  </section>
  <div id="scroll-spacer"
    style="height: max(25000px, 2500vh); width: 100%; position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none;"></div>

  <script type="module" src="src/main.js" defer></script>
</body>

</html>
